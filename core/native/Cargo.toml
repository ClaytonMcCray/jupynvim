[package]
name = "libjupynvim"
version = "0.5.0-beta.1"
edition = "2021"
description = "In-process library for jupynvim, loaded by Neovim through LuaJIT's FFI"
license = "MIT"
publish = false

[lib]
name = "jupynvim"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
# LaTeX math, KaTeX grammar, to a display list. Exact pins: 0.1.x changes its public structs.
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-font = "=0.1.15"
# Not used by name. Pinned so a regenerated lock file can never pair another lexer with this parser.
ratex-lexer = "=0.1.15"
# Display list to pixels to PNG. Never ratex-render (system fonts, prints, CoreFoundation).
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
png = "=0.18.1"

[dev-dependencies]
# The font hash test. Already in the workspace lock through jupynvim-core.
sha2 = "0.10"

# Fake libraries for the loader tests: standalone, they never use this crate.
[[example]]
name = "jnv_fake"
path = "examples/jnv_fake.rs"
crate-type = ["cdylib"]

[[example]]
name = "jnv_fake_nosym"
path = "examples/jnv_fake_nosym.rs"
crate-type = ["cdylib"]

# Its own binary without the test harness, which captures what a test
# thread's panics print and would hide a print from the check.
[[test]]
name = "no_stderr"
path = "tests/no_stderr.rs"
harness = false
